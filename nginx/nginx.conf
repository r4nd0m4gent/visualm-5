# HTTP — serves Let's Encrypt challenges and redirects to HTTPS
server {
    listen 80;
    server_name ecomaterialscollective.org www.ecomaterialscollective.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

        # Keep HTTP available for ACME validation. HTTPS is enabled after issuance.
    location / {
        return 301 https://$host$request_uri;
    }
}
