# HTTP — serve ACME challenges and redirect normal traffic to HTTPS.
server {
    listen 80;
    server_name ecomaterialscollective.org www.ecomaterialscollective.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ecomaterialscollective.org www.ecomaterialscollective.org;

    ssl_certificate /etc/letsencrypt/live/ecomaterialscollective.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecomaterialscollective.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(auth|config|materials|ingredients|user|report|org-admin/) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # Support both legacy database paths (/app/images/...) and the current
    # public path (/images/...).
    location /app/images/ {
        alias /app/images/;
    }

    location /images/ {
        alias /app/images/;
    }

    # Never cache index.html, so browsers pick up a new deploy instead of keeping the old app
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}